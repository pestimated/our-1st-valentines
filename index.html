<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title></title>
    <meta property="og:title" content="open me please">
    <meta property="og:description" content="tood tood....">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe5ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            /* ใช้ dvh เพื่อความเป๊ะบน iPhone */
            overflow: hidden;
            font-family: -apple-system, sans-serif;
            position: relative;
        }

        .instruction {
            position: absolute;
            bottom: 20%;
            left: 0;
            right: 0;
            text-align: center;
            color: #800f2f;
            font-size: 0.75rem;
            z-index: 1000;
            pointer-events: none;
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        #percentText {
            font-size: 1.0rem;
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }

        #hitBtn {
            background-color: #fb6f92;
        color: white;
        border: none;
        /* เปลี่ยนจาก 50% เป็น 100px เพื่อให้เป็นทรงมนยาว (Pill Shape) */
        border-radius: 100px; 
        /* เริ่มต้นเป็นแนวนอน */
        width: 220px; 
        height: 70px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(251, 111, 146, 0.4);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
        outline: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        z-index: 10;
        transition: border-radius 0.3s; /* ให้ค่อยๆ กลายเป็นสี่เหลี่ยมตอนเต็มจอ */
        }

        .haptic-shake {
            animation: haptic-tap 0.08s ease-out;
        }

        @keyframes haptic-tap {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(0.92);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .btn-text {
            position: absolute;
        font-size: 16px; /* ปรับขนาดตัวอักษรให้นิดนึง */
        font-weight: bold;
        pointer-events: none;
        z-index: 11;
        white-space: nowrap; /* กันตัวหนังสือตกบรรทัด */
        }
    </style>
</head>

<body>
    <button id="hitBtn">
        <span class="btn-text">DO NOT HIT ME</span>
    </button>

    <div class="instruction">
        <span id="percentText">how much the love you give me 0%</span>
    </div>

    <script>
        const btn = document.getElementById('hitBtn');
        const percentDisplay = document.getElementById('percentText');

        const baseSize = 100;
        let currentSize = baseSize;

        // ระบบเสียงและ AudioContext (ที่คุณใส่ไว้ล่าสุด)
        // ... (ยกมาใส่ตรงนี้ได้เลยค่ะ) ...

        const getPerfectFullSize = () => {
            return Math.sqrt(Math.pow(window.innerWidth, 2) + Math.pow(window.innerHeight, 2));
        };
        
        // --- แก้ไขจุดนี้ค่ะ ---
        // เนื่องจากปุ่มเราสูงแค่ 0.7 ของ currentSize 
        // เราจึงต้องหารด้วย 0.7 เพื่อให้ตอนถึง 100% ความสูงปุ่มจะเท่ากับแนวทะแยงจอพอดี
        let maxSize = getPerfectFullSize() / 0.7; 

        // ปรับ growAmount ให้เหมาะสม (ถ้าอยากให้กดประมาณ 18-20 ครั้งถึงเต็ม)
        const growAmount = (maxSize - baseSize) / 18; 
        const shrinkAmount = 1.3; 
        // ---------------------

        function updateDisplay() {
            if (currentSize < baseSize) currentSize = baseSize;

            // ปุ่มแนวนอน: กว้าง 2.2 เท่า, สูง 0.7 เท่า
            btn.style.width = (currentSize * 2.0) + 'px';
            btn.style.height = (currentSize * 0.6) + 'px';

            // ปรับความมน: พอกลบจอไปเกินครึ่ง ให้เริ่มเปลี่ยนเป็นสี่เหลี่ยมเพื่อปิดมุมจอ
            if (currentSize > (maxSize * 0.6)) {
                btn.style.borderRadius = "10px";
            } else {
                btn.style.borderRadius = "100px";
            }

            // คำนวณเปอร์เซ็นต์ (คราวนี้จะสัมพันธ์กับความสูงที่ต้องกลบจอพอดีเป๊ะ)
            let percent = Math.floor(((currentSize - baseSize) / (maxSize - baseSize)) * 100);
            
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;
            
            percentDisplay.innerText = `how much the love you give me ${percent}%`;

            if (percent >= 100) {
                window.location.href = 'card.html';
            }
        }
        
        function handleInput(e) {
            if (e && e.cancelable) e.preventDefault();

            currentSize += growAmount;
            updateDisplay();

            btn.classList.remove('haptic-shake');
            void btn.offsetWidth;
            btn.classList.add('haptic-shake');
        }

        setInterval(() => {
            if (currentSize > baseSize) {
                currentSize -= shrinkAmount;
                updateDisplay();
            }
        }, 16);

        // รับมือได้ทุกอีเวนต์
        btn.addEventListener('touchstart', handleInput, { passive: false });
        btn.addEventListener('mousedown', (e) => { if (e.button === 0) handleInput(e); });

        window.addEventListener('resize', () => {
            maxSize = getPerfectFullSize();
        });
    </script>
</body>

</html>

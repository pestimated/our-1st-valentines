<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title></title>
    <meta property="og:title" content="open me please">
    <meta property="og:description" content="">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe5ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            /* ใช้ dvh เพื่อความเป๊ะบน iPhone */
            overflow: hidden;
            font-family: -apple-system, sans-serif;
            position: relative;
        }

        .instruction {
            position: absolute;
            bottom: 20%;
            left: 0;
            right: 0;
            text-align: center;
            color: #800f2f;
            font-size: 0.75rem;
            z-index: 1000;
            pointer-events: none;
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        #percentText {
            font-size: 1.0rem;
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }

        #hitBtn {
            background-color: #fb6f92;
            color: white;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(251, 111, 146, 0.4);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }

        .haptic-shake {
            animation: haptic-tap 0.08s ease-out;
        }

        @keyframes haptic-tap {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(0.92);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .btn-text {
            position: absolute;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>

<body>
    <button id="hitBtn">
        <span class="btn-text">HIT ME</span>
    </button>

    <div class="instruction">
        <span id="percentText">percent of you loving me: 0%</span>
    </div>

    <script>
        const btn = document.getElementById('hitBtn');
        const percentDisplay = document.getElementById('percentText');

        const baseSize = 100;
        let currentSize = baseSize;

        // --- ลอจิกการคำนวณ ---
        const getPerfectFullSize = () => {
            return Math.sqrt(Math.pow(window.innerWidth, 2) + Math.pow(window.innerHeight, 2));
        };

        let maxSize = getPerfectFullSize();
        const growAmount = (maxSize - baseSize) / 15;
        const shrinkAmount = 1.2;

        function updateDisplay() {
            if (currentSize < baseSize) currentSize = baseSize;
            btn.style.width = currentSize + 'px';
            btn.style.height = currentSize + 'px';

            let percent = Math.floor(((currentSize - baseSize) / (maxSize - baseSize)) * 100);
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;

            percentDisplay.innerText = `percent of you loving me: ${percent}%`;

            if (percent >= 100) {
                window.location.href = 'card.html';
            }
        }

        function handleInput(e) {
            if (e && e.cancelable) e.preventDefault();

            currentSize += growAmount;
            updateDisplay();

            btn.classList.remove('haptic-shake');
            void btn.offsetWidth;
            btn.classList.add('haptic-shake');
        }

        setInterval(() => {
            if (currentSize > baseSize) {
                currentSize -= shrinkAmount;
                updateDisplay();
            }
        }, 16);

        // รับมือได้ทุกอีเวนต์
        btn.addEventListener('touchstart', handleInput, { passive: false });
        btn.addEventListener('mousedown', (e) => { if (e.button === 0) handleInput(e); });

        window.addEventListener('resize', () => {
            maxSize = getPerfectFullSize();
        });
    </script>
</body>

</html>

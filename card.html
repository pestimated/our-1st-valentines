<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title></title>
    <style>
        :root {
            --bg-color: #ffe5ec;
            --dark-pink: #fb6f92;
            --text-color: #800f2f;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .header-text {
            color: var(--text-color);
            text-align: center;
            margin: 40px 0 30px;
            animation: fadeIn 1s ease-out;
        }

        /* --- Gift Grid --- */
        .gift-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            width: 100%;
            max-width: 300px;
            z-index: 10;
        }

        .gift-item {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(251, 111, 146, 0.15);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: bounceIn 0.8s ease-out backwards;
        }

        .gift-item:active { transform: scale(0.9); }
        .gift-item .icon { font-size: 3.5rem; display: block; margin-bottom: 10px; }
        .gift-item .label { color: var(--text-color); font-weight: bold; font-size: 0.9rem; }

        /* --- Modal (Pop-up) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(128, 15, 47, 0.4);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 30px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            position: relative;
            animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .close-btn {
            margin-top: 20px;
            background: var(--dark-pink);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- Voucher Styling --- */
        .voucher {
            border: 2px dashed var(--dark-pink);
            padding: 15px;
            border-radius: 15px;
            background: #fffafa;
            margin-top: 15px;
        }

        .voucher-title { font-size: 0.8rem; color: #888; text-transform: uppercase; }
        .voucher-value { font-size: 1.2rem; color: var(--dark-pink); font-weight: bold; margin: 5px 0; }

        /* --- Animations --- */
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .floating-heart {
            position: fixed; color: rgba(251, 111, 146, 0.3);
            pointer-events: none; z-index: -1;
            animation: moveUp 5s linear infinite;
        }
        @keyframes moveUp {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header-text">
        <h2>♡ happy valentine's day ♡</h2>
        <p>Things I want to give you kub bibi</p>
    </div>

    <div class="gift-grid">
        <div class="gift-item" onclick="openModal('wish')" style="animation-delay: 0.1s">
            <span class="icon">🎁</span>
            <span class="label">GIFT 1</span>
        </div>
        <div class="gift-item" onclick="openModal('flower')" style="animation-delay: 0.3s">
            <span class="icon">🎁</span>
            <span class="label">GIFT 2</span>
        </div>
        <div class="gift-item" onclick="openModal('voucher')" style="animation-delay: 0.5s">
            <span class="icon">🎁</span>
            <span class="label">GIFT 3</span>
        </div>
    </div>

    <div id="modalOverlay" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modalBody"></div>
            <button class="close-btn" onclick="closeModal()">closed</button>
        </div>
    </div>

    <script>
        const content = {
            wish: `
                <h3 style="color: #fb6f92;">LETTER 💌</h3>
                <p style="color: #800f2f; line-height: 1.6; text-align: right;">
                    Message to my bibi<br>
                <p style="color: #800f2f; line-height: 1.6; text-align: left;">
                    อะแฮ่ม สวัสดีคับคนสวย<br>
                    ไม่รู้ว่าจะชอบไหม ไอสิ่งนี้ที่ทำให้ 👉🏻👈🏻<br>
                    ดีใจที่ปีนี้บิบิ๋เข้ามาเป็นวาเลนไทน์ของพี่<br>
                    อยากให้เป็นแบบนี้ทุก ๆ ปีเลย ᵔ ᵕ ᵔ<br>
                    ปีหน้าไปเดทกันนะ ขอจองตัวอีกหลายหลายปี<br>
                    เค้ารักบิบิ๋มากมากเลย ❤️
                </p>
            `,
            flower: `
               <h3 style="color: #fb6f92;">FLOWER 🌷</h3>
                <div style="width: 75%; aspect-ratio: 1/1; margin: 15px auto; overflow: hidden; border-radius: 15px; border: 4px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center; background-color: #ffffff;">
                    <img src="flower.jpg" style="width: 85%; height: auto; max-height: 85%; object-fit: contain;" alt="My drawing for you">
                </div>
                <p style="color: #800f2f;"><br>วาเลนไทน์ทั้งทีก็ต้องมีดอกไม้สิเนอะ <br>
                    I wanna give you all of flowers I've got :) <br>
                </p>
            `,
            voucher: `
                <h3 style="color: #fb6f92;">VOUCHER 🎫</h3>
                <div class="voucher">
                    <div class="voucher-title">Valentine's Gift Voucher</div>
                    <div class="voucher-value">ไก่ทอดเอบีซี 🍗</div>
                    <div class="voucher-title">มูล 500 บาท</div>
                </div>
                <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">* ไม่มีวันหมดอายุ จนกว่าเราจะได้ไปกินด้วยกัน</p>
            `
        };

        function openModal(type) {
            document.getElementById('modalBody').innerHTML = content[type];
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // หัวใจลอยๆ
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, 600);
    </script>
</body>
</html>
